<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="description" content="Cotizaciones rápidas desde el teléfono. Hecho por IngenioTech.">
  <title>Cotiza Rápido</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="encabezado">
    <h1>Cotiza Rápido</h1>
  </header>

  <main>
    <section id="cotizacion" aria-labelledby="titulo-cotizacion">
      <h2 id="titulo-cotizacion">Cotización</h2>

      <form id="form-cotizacion" autocomplete="off">
        <fieldset class="grupo">
          <legend>Cliente</legend>
          <div class="campo">
            <label for="cliente-nombre">Nombre</label>
            <input id="cliente-nombre" name="clienteNombre" type="text">
          </div>
          <div class="campo">
            <label for="cliente-telefono">Teléfono</label>
            <input id="cliente-telefono" name="clienteTelefono" type="tel" inputmode="tel">
          </div>
        </fieldset>

        <fieldset class="grupo">
          <legend>Líneas</legend>
          <ul id="lineas" class="lineas"></ul>
          <button type="button" id="anadir-linea" class="boton-secundario">Añadir línea</button>
        </fieldset>

        <div class="campo">
          <label for="notas">Notas</label>
          <textarea id="notas" name="notas"></textarea>
        </div>

        <dl class="totales">
          <div><dt>Subtotal</dt><dd id="total-subtotal">$0.00</dd></div>
          <div><dt>Impuesto</dt><dd id="total-impuesto">$0.00</dd></div>
          <div class="total-final"><dt>Total</dt><dd id="total-total">$0.00</dd></div>
        </dl>

        <p id="cotizacion-numero" class="numero-cotizacion"></p>
        <div class="acciones">
          <button type="button" id="guardar-cotizacion">Guardar</button>
          <button type="button" id="enviar-whatsapp" class="boton-secundario">WhatsApp</button>
          <button type="button" id="nueva-cotizacion" class="boton-secundario">Nueva cotización</button>
        </div>
        <p id="cotizacion-estado" class="aviso" role="status"></p>
      </form>

      <template id="plantilla-linea">
        <li class="linea">
          <div class="campo linea-descripcion">
            <label data-para="descripcion">Descripción</label>
            <input type="text" data-campo="descripcion">
          </div>
          <div class="campo">
            <label data-para="cantidad">Cantidad</label>
            <input type="text" inputmode="decimal" value="1" data-campo="cantidad">
          </div>
          <div class="campo">
            <label data-para="precio">Precio</label>
            <input type="text" inputmode="decimal" placeholder="0.00" data-campo="precio">
          </div>
          <button type="button" class="boton-peligro quitar-linea">Quitar línea</button>
        </li>
      </template>
    </section>

    <section id="historial" aria-labelledby="titulo-historial" hidden>
      <h2 id="titulo-historial">Historial</h2>

      <p id="historial-vacio" class="vacio">Todavía no hay cotizaciones guardadas.</p>
      <ul id="lista-historial" class="historial"></ul>
      <p id="historial-estado" class="aviso" role="status"></p>

      <template id="plantilla-historial">
        <li class="cotizacion-guardada">
          <p class="cotizacion-titulo"><span data-dato="numero"></span> · <span data-dato="fecha"></span></p>
          <p data-dato="cliente"></p>
          <p class="cotizacion-total" data-dato="total"></p>
          <div class="acciones">
            <button type="button" class="boton-secundario" data-accion="abrir">Abrir</button>
            <button type="button" class="boton-secundario" data-accion="duplicar">Duplicar</button>
            <button type="button" class="boton-peligro" data-accion="borrar">Borrar</button>
          </div>
        </li>
      </template>
    </section>

    <section id="negocio" aria-labelledby="titulo-negocio" hidden>
      <h2 id="titulo-negocio">Mi negocio</h2>

      <form id="form-negocio" autocomplete="off">
        <div class="campo">
          <label for="negocio-nombre">Nombre del negocio</label>
          <input id="negocio-nombre" name="nombre" type="text">
        </div>
        <div class="campo">
          <label for="negocio-telefono">Teléfono</label>
          <input id="negocio-telefono" name="telefono" type="tel" inputmode="tel">
        </div>
        <div class="campo">
          <label for="negocio-impuesto">Impuesto (%)</label>
          <input id="negocio-impuesto" name="impuesto" type="text" inputmode="decimal" placeholder="0">
        </div>
        <div class="campo">
          <label for="negocio-nota">Nota al pie</label>
          <textarea id="negocio-nota" name="nota" placeholder="Válida por 15 días"></textarea>
        </div>
        <button type="submit">Guardar</button>
        <p id="negocio-estado" class="aviso" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="pie">
    <p>Hecho por IngenioTech</p>
  </footer>

  <nav class="barra" aria-label="Secciones">
    <button type="button" data-seccion="cotizacion" aria-controls="cotizacion" aria-current="page">Cotización</button>
    <button type="button" data-seccion="historial" aria-controls="historial">Historial</button>
    <button type="button" data-seccion="negocio" aria-controls="negocio">Mi negocio</button>
  </nav>

  <dialog id="confirmar-borrado" class="dialogo" aria-labelledby="confirmar-texto">
    <form method="dialog">
      <p id="confirmar-texto" class="dialogo-texto"></p>
      <div class="acciones">
        <button type="submit" value="cancelar" class="boton-secundario" autofocus>Cancelar</button>
        <button type="submit" value="borrar" class="boton-borrar">Borrar</button>
      </div>
    </form>
  </dialog>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="description" content="Cotizaciones rápidas desde el teléfono. Hecho por IngenioTech.">
  <title>Cotiza Rápido</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="encabezado">
    <h1>Cotiza Rápido</h1>
  </header>

  <main>
    <section id="cotizacion" aria-labelledby="titulo-cotizacion">
      <h2 id="titulo-cotizacion">Cotización</h2>
    </section>

    <section id="historial" aria-labelledby="titulo-historial" hidden>
      <h2 id="titulo-historial">Historial</h2>
    </section>

    <section id="negocio" aria-labelledby="titulo-negocio" hidden>
      <h2 id="titulo-negocio">Mi negocio</h2>
    </section>
  </main>

  <footer class="pie">
    <p>Hecho por IngenioTech</p>
  </footer>

  <nav class="barra" aria-label="Secciones">
    <button type="button" data-seccion="cotizacion" aria-controls="cotizacion" aria-current="page">Cotización</button>
    <button type="button" data-seccion="historial" aria-controls="historial">Historial</button>
    <button type="button" data-seccion="negocio" aria-controls="negocio">Mi negocio</button>
  </nav>
</body>
</html>
